name: Daily Assessment Report

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-assessments
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  assess-and-deploy:
    name: Assess integrations and deploy report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Get latest Sentry SDK versions
        id: sentry-versions
        run: |
          echo "js=$(npm view @sentry/node version)" >> "$GITHUB_OUTPUT"
          echo "python=$(python3 -c 'import json,urllib.request; print(json.load(urllib.request.urlopen("https://pypi.org/pypi/sentry-sdk/json"))["info"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Cache assessment environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            runs/**/node_modules
            runs/**/.venv
          key: assessments-${{ runner.os }}-js-${{ steps.sentry-versions.outputs.js }}-python-${{ steps.sentry-versions.outputs.python }}-${{ hashFiles('src/runner/templates/**/config.json') }}

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run assessments
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        run: npm test -- run --parallel 12

      - name: Prepare assessment site
        run: |
          report_json=$(find test-results -maxdepth 1 -name 'assessment-report-*.json' -type f -print | sort | tail -1)
          report_html=$(find test-results -maxdepth 1 -name 'assessment-report-*.html' -type f -print | sort | tail -1)
          test -n "$report_json" && test -n "$report_html"
          today=$(date -u +%Y-%m-%d)
          mkdir -p "_site/reports/$today"
          cp "$report_html" _site/index.html
          cp "$report_html" "_site/reports/$today/index.html"
          cp "$report_json" "_site/reports/$today/assessment.json"
          echo "REPORT_JSON=$report_json" >> "$GITHUB_ENV"

      - name: Upload assessment artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-report-${{ github.run_id }}
          path: test-results/assessment-report-*
          retention-days: 90

      - name: Upload assessment execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-logs-${{ github.run_id }}
          path: runs/**/assessment.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fetch existing assessment history
        continue-on-error: true
        env:
          PAGES_OWNER: ${{ github.repository_owner }}
          PAGES_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          pages_url="https://${PAGES_OWNER}.github.io/${PAGES_REPOSITORY}"
          curl -sSf "$pages_url/history.json" -o history.json 2>/dev/null || echo '{"schemaVersion":"3","scoringVersion":"3","entries":[]}' > history.json

      - name: Update assessment history
        run: node .github/scripts/update-assessment-history.cjs "$REPORT_JSON" history.json

      - name: Fetch existing dated reports
        continue-on-error: true
        env:
          PAGES_OWNER: ${{ github.repository_owner }}
          PAGES_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          pages_url="https://${PAGES_OWNER}.github.io/${PAGES_REPOSITORY}"
          node .github/scripts/fetch-existing-reports.cjs history.json _site "$pages_url"

      - name: Publish assessment history
        run: cp history.json _site/history.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
