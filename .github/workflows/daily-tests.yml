name: Daily Test Report

on:
  schedule:
    # Every day at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual triggers

concurrency:
  group: daily-tests
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    name: Run Tests & Deploy Report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v5

      - name: Cache Node test environments
        uses: actions/cache@v4
        with:
          path: runs/node
          key: node-envs-daily-${{ runner.os }}-${{ hashFiles('src/runner/templates/**/node/**/config.json') }}
          restore-keys: |
            node-envs-daily-${{ runner.os }}-

      - name: Cache Browser test environments
        uses: actions/cache@v4
        with:
          path: runs/browser
          key: browser-envs-daily-${{ runner.os }}-${{ hashFiles('src/runner/templates/**/browser/**/config.json') }}
          restore-keys: |
            browser-envs-daily-${{ runner.os }}-

      - name: Cache Next.js test environments
        uses: actions/cache@v4
        with:
          path: runs/nextjs
          key: nextjs-envs-daily-${{ runner.os }}-${{ hashFiles('src/runner/templates/**/nextjs/**/config.json') }}
          restore-keys: |
            nextjs-envs-daily-${{ runner.os }}-

      - name: Cache Python test environments
        uses: actions/cache@v4
        with:
          path: runs/python
          key: python-envs-daily-${{ runner.os }}-${{ hashFiles('src/runner/templates/**/python/**/config.json') }}
          restore-keys: |
            python-envs-daily-${{ runner.os }}-

      - name: Cache PHP test environments
        uses: actions/cache@v4
        with:
          path: runs/php
          key: php-envs-daily-${{ runner.os }}-${{ hashFiles('src/runner/templates/**/php/**/config.json') }}
          restore-keys: |
            php-envs-daily-${{ runner.os }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers (for browser platform only)
        run: npx playwright install --with-deps chromium

      - name: Run tests
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        run: npm run test -- -j=12

      - name: Generate HTML report
        run: |
          CTRF_FILE=$(ls -t test-results/ctrf-report-*.json | head -1)
          npm run report "$CTRF_FILE"
          mkdir -p _site
          cp $(ls -t test-results/test-report-*.html | head -1) _site/index.html

      - name: Upload CTRF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-report-${{ github.run_id }}
          path: test-results/ctrf-report-*.json
          retention-days: 90

      - name: Fetch existing history from GitHub Pages
        continue-on-error: true
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -sSf "${PAGES_URL}/history.json" -o history.json 2>/dev/null || echo "[]" > history.json

      - name: Seed history from past CI runs (one-time)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat history.json 2>/dev/null)" = "[]" ] || [ ! -s history.json ]; then
            echo "No existing history found, seeding from past workflow runs..."
            node .github/scripts/extract-history.cjs history.json
          fi

      - name: Update history with today's results
        run: |
          CTRF_FILE=$(ls -t test-results/ctrf-report-*.json | head -1)
          node .github/scripts/update-history.cjs "$CTRF_FILE" history.json

      - name: Generate trends page
        run: |
          node .github/scripts/generate-trends-page.cjs history.json _site/trends.html
          cp history.json _site/history.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
