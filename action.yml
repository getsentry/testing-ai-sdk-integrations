name: "Run AI SDK Integration Tests"
description: "Run AI SDK integration tests for a specific language (js or python) and report failures"
author: "Sentry Telemetry Experience Team"

branding:
  icon: "triangle"
  color: "purple"

inputs:
  language:
    description: "SDK language to test. One of: js, py, or leave empty for both"
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI API key"
    required: true
  anthropic-api-key:
    description: "Anthropic API key"
    required: true
  google-api-key:
    description: "Google API key for GenAI"
    required: true

outputs:
  success:
    description: "Whether all tests passed"
    value: ${{ steps.run-tests.outputs.success }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Setup Python
      if: inputs.language == 'py' || inputs.language == ''
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install orchestration dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/shared/orchestration
      run: npm install

    - name: Setup SDK dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ "${{ inputs.language }}" = "py" ]; then
          npm run cli setup -- --local-sentry-python ../../sentry-python
        elif [ -z "${{ inputs.language }}" ]; then
          npm run cli setup
        else
          npm run cli setup ${{ inputs.language }}
        fi

    - name: Run tests
      id: run-tests
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GOOGLE_API_KEY: ${{ inputs.google-api-key }}
      run: |
        set +e
        if [ -z "${{ inputs.language }}" ]; then
          npm run cli run -- --all --reports ctrf
        else
          npm run cli run ${{ inputs.language }} -- --reports ctrf
        fi
        EXIT_CODE=$?
        set -e

        if [ $EXIT_CODE -eq 0 ]; then
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "success=false" >> $GITHUB_OUTPUT
        fi

        exit $EXIT_CODE

    - name: Create or update issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          // Helper functions
          const formatDuration = (ms) => ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(2)}s`;
          const getStatusIcon = (status) => {
            const icons = { passed: '✓', failed: '✗', skipped: '○' };
            return icons[status] || '-';
          };

          // Try to read and format test results from CTRF report
          let resultsContent = 'Test execution failed. Check the [workflow run](' + runUrl + ') for details.';
          const ctrfPath = '${{ github.action_path }}/shared/orchestration/test-results/ctrf-report.json';

          if (fs.existsSync(ctrfPath)) {
            try {
              const report = JSON.parse(fs.readFileSync(ctrfPath, 'utf8'));
              const summary = report.results.summary;
              const tests = report.results.tests;
              const duration = summary.stop - summary.start;

              // Build summary table
              let content = '## 📊 Summary\n\n';
              content += '| Metric | Value |\n|--------|-------|\n';
              content += `| **Total Tests** | ${summary.tests} |\n`;
              content += `| **✓ Passed** | ${summary.passed} |\n`;
              content += `| **✗ Failed** | ${summary.failed} |\n`;
              content += `| **Duration** | ${formatDuration(duration)} |\n\n`;

              // Build test matrix
              const sdks = [...new Set(tests.map(t => (t.suite?.[0] || 'unknown')))].sort();
              const testCases = [...new Set(tests.map(t => t.name.split(' :: ')[1] || t.name))].sort();

              const testMap = new Map();
              tests.forEach(test => {
                const caseId = test.name.split(' :: ')[1] || test.name;
                const suite = test.suite?.[0] || 'unknown';
                testMap.set(`${suite}::${caseId}`, test);
              });

              content += '## 🧪 Test Matrix\n\n';
              content += '| SDK | ' + testCases.join(' | ') + ' |\n';
              content += '|-----|' + testCases.map(() => '-----').join('|') + '|\n';

              sdks.forEach(sdk => {
                content += `| **${sdk}** |`;
                testCases.forEach(caseId => {
                  const test = testMap.get(`${sdk}::${caseId}`);
                  content += test ? ` ${getStatusIcon(test.status)} |` : ' - |';
                });
                content += '\n';
              });
              content += '\n';

              // Build failed tests details
              const failedTests = tests.filter(t => t.status === 'failed');
              if (failedTests.length > 0) {
                content += '## ❌ Failed Tests Details\n\n';
                failedTests.forEach(test => {
                  const caseId = test.name.split(' :: ')[1] || test.name;
                  const suite = test.suite?.[0] || 'unknown';
                  content += `<details>\n<summary><strong>${suite}</strong> :: ${caseId} (${test.duration}ms)</summary>\n\n`;
                  if (test.trace) content += '```\n' + test.trace + '\n```\n';
                  content += '</details>\n\n';
                });
              }

              resultsContent = content;
            } catch (e) {
              console.log('Could not parse test results:', e.message);
            }
          }

          const issueLabel = 'ai-integration-test-failure';
          const date = new Date();
          const formattedDate = date.toLocaleString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            timeZone: 'UTC',
            timeZoneName: 'short'
          });
          const body = `## AI Integration Test Failure

          **Date**: ${formattedDate}
          **Workflow Run**: ${runUrl}

          ${resultsContent}

          ---
          *This issue was automatically created by the [AI Integration Testing framework](https://github.com/getsentry/testing-ai-sdk-integrations).*
          `;

          // Check for existing open issues with the label
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: issueLabel,
            state: 'open'
          });

          if (issues.data.length > 0) {
            // Update existing issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues.data[0].number,
              body: body
            });
            console.log(`Updated existing issue #${issues.data[0].number}`);
          } else {
            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ AI Integration Tests Failed',
              body: body,
              labels: [issueLabel, 'automated']
            });
            console.log('Created new issue');
          }
