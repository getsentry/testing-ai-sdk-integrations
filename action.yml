name: "Run AI SDK Integration Assessments"
description: "Assess Sentry AI SDK integrations and publish native assessment reports"
author: "Sentry Telemetry Experience Team"

branding:
  icon: "triangle"
  color: "purple"

inputs:
  platform:
    description: "Platform to assess: node, python, nextjs, cloudflare, js, or empty for all"
    required: false
    default: ""
  framework:
    description: "Framework name or wildcard to assess (for example openai or vercel-*)"
    required: false
    default: ""
  category:
    description: "Assessment category: llm or agents"
    required: false
    default: ""
  option:
    description: "Variant filter in key=value form"
    required: false
    default: ""
  quick:
    description: "Assess one representative variant per target"
    required: false
    default: "false"
  parallel:
    description: "Maximum number of variants to assess concurrently"
    required: false
    default: "10"
  sentry-python-path:
    description: "Path to a local sentry-python checkout for editable installation"
    required: false
    default: ""
  sentry-javascript-path:
    description: "Path to a local sentry-javascript checkout for package linking"
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI API key"
    required: true
  openrouter-api-key:
    description: "OpenRouter API key used through the Anthropic-compatible endpoint"
    required: true
  google-genai-api-key:
    description: "Google GenAI API key"
    required: true
outputs:
  report-path:
    description: "Absolute path to the native assessment JSON report"
    value: ${{ steps.run-assessments.outputs.report-path }}
  targets:
    description: "Number of assessed targets"
    value: ${{ steps.run-assessments.outputs.targets }}
  variants:
    description: "Number of assessed variants"
    value: ${{ steps.run-assessments.outputs.variants }}
  complete:
    description: "Number of complete variants"
    value: ${{ steps.run-assessments.outputs.complete }}
  incomplete:
    description: "Number of incomplete variants"
    value: ${{ steps.run-assessments.outputs.incomplete }}
  critical:
    description: "Number of critical findings"
    value: ${{ steps.run-assessments.outputs.critical }}
  major:
    description: "Number of major findings"
    value: ${{ steps.run-assessments.outputs.major }}
  minor:
    description: "Number of minor findings"
    value: ${{ steps.run-assessments.outputs.minor }}
  info:
    description: "Number of informational findings"
    value: ${{ steps.run-assessments.outputs.info }}
  health:
    description: "Overall assessment health or out_of_spec when execution is incomplete"
    value: ${{ steps.run-assessments.outputs.health }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"

    - name: Setup Python
      if: inputs.platform == 'python' || inputs.platform == ''
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install uv
      if: inputs.platform == 'python' || inputs.platform == ''
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

    - name: Install dependencies and build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    - name: Run assessments
      id: run-assessments
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_OPTION: ${{ inputs.option }}
        INPUT_QUICK: ${{ inputs.quick }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_SENTRY_PYTHON_PATH: ${{ inputs.sentry-python-path }}
        INPUT_SENTRY_JAVASCRIPT_PATH: ${{ inputs.sentry-javascript-path }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GOOGLE_GENAI_API_KEY: ${{ inputs.google-genai-api-key }}
      run: |
        set +e
        args=(run --parallel "$INPUT_PARALLEL")
        [[ -n "$INPUT_PLATFORM" ]] && args+=(--platform "$INPUT_PLATFORM")
        [[ -n "$INPUT_FRAMEWORK" ]] && args+=(--framework "$INPUT_FRAMEWORK")
        [[ -n "$INPUT_CATEGORY" ]] && args+=(--category "$INPUT_CATEGORY")
        [[ -n "$INPUT_OPTION" ]] && args+=(--option "$INPUT_OPTION")
        [[ "$INPUT_QUICK" == "true" ]] && args+=(--quick)
        [[ -n "$INPUT_SENTRY_PYTHON_PATH" ]] && args+=(--sentry-python "$INPUT_SENTRY_PYTHON_PATH")
        [[ -n "$INPUT_SENTRY_JAVASCRIPT_PATH" ]] && args+=(--sentry-javascript "$INPUT_SENTRY_JAVASCRIPT_PATH")

        npm test -- "${args[@]}"
        exit_code=$?
        set -e

        report=$(find test-results -maxdepth 1 -name 'assessment-report-*.json' -type f -print | sort | tail -1)
        if [[ -z "$report" ]]; then
          echo "Assessment execution did not produce a native JSON report." >&2
          exit 1
        fi

        absolute_report="${{ github.action_path }}/$report"
        echo "report-path=$absolute_report" >> "$GITHUB_OUTPUT"
        echo "targets=$(jq -r '.summary.targets' "$report")" >> "$GITHUB_OUTPUT"
        echo "variants=$(jq -r '.summary.variants' "$report")" >> "$GITHUB_OUTPUT"
        echo "complete=$(jq -r '.summary.complete' "$report")" >> "$GITHUB_OUTPUT"
        echo "incomplete=$(jq -r '.summary.incomplete' "$report")" >> "$GITHUB_OUTPUT"
        echo "critical=$(jq -r '.summary.findings.critical' "$report")" >> "$GITHUB_OUTPUT"
        echo "major=$(jq -r '.summary.findings.major' "$report")" >> "$GITHUB_OUTPUT"
        echo "minor=$(jq -r '.summary.findings.minor' "$report")" >> "$GITHUB_OUTPUT"
        echo "info=$(jq -r '.summary.findings.info' "$report")" >> "$GITHUB_OUTPUT"
        health=$(jq -r '
          if .summary.incomplete > 0 then "out_of_spec"
          elif .summary.health.broken > 0 then "broken"
          elif .summary.health.degraded > 0 then "degraded"
          elif .summary.health.healthy_with_notes > 0 then "healthy_with_notes"
          else "healthy" end
        ' "$report")
        echo "health=$health" >> "$GITHUB_OUTPUT"
        exit "$exit_code"

    - name: Upload assessment reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: assessment-results
        path: ${{ github.action_path }}/test-results/assessment-report-*
        if-no-files-found: warn

    - name: Create or update assessment issue
      if: always()
      continue-on-error: true
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        REPORT_PATH: ${{ steps.run-assessments.outputs.report-path }}
      with:
        script: |
          const fs = require('fs');
          const reportPath = process.env.REPORT_PATH;
          if (!reportPath || !fs.existsSync(reportPath)) return;

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const { summary } = report;
          if (summary.incomplete === 0 && summary.findings.critical === 0 && summary.findings.major === 0) return;

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const incomplete = report.targets
            .filter(target => target.completion === 'incomplete')
            .map(target => `- \`${target.id}\`: ${target.variants.filter(variant => variant.completion === 'incomplete').length} incomplete variant(s)`);
          const findings = report.targets.flatMap(target => target.findings
            .filter(finding => finding.severity === 'critical' || finding.severity === 'major')
            .map(finding => `- **${finding.severity}** \`${target.id}\` / \`${finding.findingId}\`: ${finding.title}`));
          const body = [
            '## AI SDK integration assessment',
            '',
            `**Generated:** ${report.generatedAt}`,
            `**Workflow run:** ${runUrl}`,
            '',
            '| Targets | Variants | Complete | Incomplete | Critical | Major | Minor | Info |',
            '| ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |',
            `| ${summary.targets} | ${summary.variants} | ${summary.complete} | ${summary.incomplete} | ${summary.findings.critical} | ${summary.findings.major} | ${summary.findings.minor} | ${summary.findings.info} |`,
            '',
            ...(incomplete.length ? ['### Incomplete targets', '', ...incomplete, ''] : []),
            ...(findings.length ? ['### Critical and major findings', '', ...findings.slice(0, 100), ''] : []),
            '---',
            '*Generated by the Sentry AI SDK integration assessment action.*',
          ].join('\n');

          const title = 'AI SDK integration assessment needs attention';
          const response = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 100,
          });
          const issue = response.data.find(item => item.title === title && !item.pull_request);
          if (issue) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title,
              body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
          }
