name: "Run AI SDK Integration Tests"
description: "Run AI SDK integration tests for a specific language (js or python) and report failures"
author: "Sentry Telemetry Experience Team"

branding:
  icon: "triangle"
  color: "purple"

inputs:
  platform:
    description: "Platform to test. One of: js, py, php, or leave empty for all"
    required: false
    default: ""
  framework:
    description: "Specific framework to test (e.g., openai, anthropic, langchain)"
    required: false
    default: ""
  test:
    description: "Specific test to run (e.g., 'Basic LLM Test')"
    required: false
    default: ""
  parallel:
    description: "Number of tests to run in parallel"
    required: false
    default: "4"
  sentry-python-path:
    description: "Path to local sentry-python repository for editable install"
    required: false
    default: ""
  sentry-javascript-path:
    description: "Path to local sentry-javascript repository for linking"
    required: false
    default: ""
  sentry-php-path:
    description: "Path to local sentry-php repository (core PHP SDK)"
    required: false
    default: ""
  sentry-laravel-path:
    description: "Path to local sentry-laravel repository for composer path repository"
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI API key"
    required: true
  anthropic-api-key:
    description: "Anthropic API key"
    required: true
  google-api-key:
    description: "Google API key for GenAI"
    required: true
  google-vertex-project:
    description: "Google Vertex AI project ID"
    required: false
    default: ""
  google-vertex-location:
    description: "Google Vertex AI location"
    required: false
    default: "us-central1"

outputs:
  success:
    description: "Whether all tests passed"
    value: ${{ steps.run-tests.outputs.success }}
  total:
    description: "Total number of tests run"
    value: ${{ steps.run-tests.outputs.total }}
  passed:
    description: "Number of tests passed"
    value: ${{ steps.run-tests.outputs.passed }}
  failed:
    description: "Number of tests failed"
    value: ${{ steps.run-tests.outputs.failed }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Setup Python
      if: inputs.platform == 'py' || inputs.platform == ''
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv (Python package manager)
      if: inputs.platform == 'py' || inputs.platform == ''
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies and build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install
        npm run build

    - name: Install Playwright browsers
      if: inputs.platform == '' || inputs.platform == 'browser' || inputs.platform == 'js'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx playwright install --with-deps chromium

    - name: Run tests
      id: run-tests
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GOOGLE_API_KEY: ${{ inputs.google-api-key }}
        GOOGLE_VERTEX_PROJECT: ${{ inputs.google-vertex-project }}
        GOOGLE_VERTEX_LOCATION: ${{ inputs.google-vertex-location }}
      run: |
        set +e

        # Build command arguments
        ARGS=""

        if [ -n "${{ inputs.platform }}" ]; then
          ARGS="$ARGS --platform ${{ inputs.platform }}"
        fi

        if [ -n "${{ inputs.framework }}" ]; then
          ARGS="$ARGS --framework ${{ inputs.framework }}"
        fi

        if [ -n "${{ inputs.test }}" ]; then
          ARGS="$ARGS --test \"${{ inputs.test }}\""
        fi

        if [ -n "${{ inputs.parallel }}" ]; then
          ARGS="$ARGS -j=${{ inputs.parallel }}"
        fi

        if [ -n "${{ inputs.sentry-python-path }}" ]; then
          ARGS="$ARGS --sentry-python ${{ inputs.sentry-python-path }}"
        fi

        if [ -n "${{ inputs.sentry-javascript-path }}" ]; then
          ARGS="$ARGS --sentry-javascript ${{ inputs.sentry-javascript-path }}"
        fi

        if [ -n "${{ inputs.sentry-php-path }}" ]; then
          ARGS="$ARGS --sentry-php ${{ inputs.sentry-php-path }}"
        fi

        if [ -n "${{ inputs.sentry-laravel-path }}" ]; then
          ARGS="$ARGS --sentry-laravel ${{ inputs.sentry-laravel-path }}"
        fi

        # Run tests
        echo "Running: npm run test -- $ARGS"
        eval "npm run test -- $ARGS"
        EXIT_CODE=$?
        set -e

        # Parse CTRF report for outputs (find latest report with timestamp)
        CTRF_REPORT=$(ls -t test-results/ctrf-report-*.json 2>/dev/null | head -1)
        if [ -n "$CTRF_REPORT" ] && [ -f "$CTRF_REPORT" ]; then
          TOTAL=$(jq -r '.results.summary.tests' "$CTRF_REPORT")
          PASSED=$(jq -r '.results.summary.passed' "$CTRF_REPORT")
          FAILED=$(jq -r '.results.summary.failed' "$CTRF_REPORT")
          
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "ctrf_report=$CTRF_REPORT" >> $GITHUB_OUTPUT
        else
          echo "total=0" >> $GITHUB_OUTPUT
          echo "passed=0" >> $GITHUB_OUTPUT
          echo "failed=0" >> $GITHUB_OUTPUT
          echo "ctrf_report=" >> $GITHUB_OUTPUT
        fi

        if [ $EXIT_CODE -eq 0 ]; then
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "success=false" >> $GITHUB_OUTPUT
        fi

        exit $EXIT_CODE

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ github.action_path }}/test-results/
        if-no-files-found: ignore

    - name: Create or update issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const formatDuration = (ms) => ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(2)}s`;
          const getStatusIcon = (status) => {
            const icons = { passed: '\u2713', failed: '\u2717', skipped: '\u25CB' };
            return icons[status] || '-';
          };

          let resultsContent = 'Test execution failed. Check the [workflow run](' + runUrl + ') for details.';
          // Find latest CTRF report
          const testResultsDir = '${{ github.action_path }}/test-results';
          let ctrfPath = '';
          if (fs.existsSync(testResultsDir)) {
            const files = fs.readdirSync(testResultsDir)
              .filter(f => f.startsWith('ctrf-report-') && f.endsWith('.json'))
              .sort()
              .reverse();
            if (files.length > 0) {
              ctrfPath = testResultsDir + '/' + files[0];
            }
          }

          if (fs.existsSync(ctrfPath)) {
            try {
              const report = JSON.parse(fs.readFileSync(ctrfPath, 'utf8'));
              const summary = report.results.summary;
              const tests = report.results.tests;
              const duration = summary.stop - summary.start;

              let content = '## Summary\n\n';
              content += '| Metric | Value |\n|--------|-------|\n';
              content += `| **Total Tests** | ${summary.tests} |\n`;
              content += `| **Passed** | ${summary.passed} |\n`;
              content += `| **Failed** | ${summary.failed} |\n`;
              content += `| **Skipped** | ${summary.skipped || 0} |\n`;
              content += `| **Duration** | ${formatDuration(duration)} |\n\n`;

              const byFramework = {};
              tests.forEach(test => {
                const framework = test.suite && test.suite[0] ? test.suite[0] : 'unknown';
                if (!byFramework[framework]) byFramework[framework] = [];
                byFramework[framework].push(test);
              });

              content += '## Results by Framework\n\n';
              
              Object.keys(byFramework).sort().forEach(framework => {
                const frameworkTests = byFramework[framework];
                const failed = frameworkTests.filter(t => t.status === 'failed').length;
                
                const statusIcon = failed > 0 ? 'FAILED' : 'PASSED';
                content += `### ${statusIcon} - ${framework}\n\n`;
                content += '| Test | Status | Duration |\n|------|--------|----------|\n';
                
                frameworkTests.forEach(test => {
                  const testName = test.name.replace(framework + ' :: ', '');
                  const icon = getStatusIcon(test.status);
                  const dur = test.duration ? formatDuration(test.duration) : '-';
                  content += `| ${testName} | ${icon} ${test.status} | ${dur} |\n`;
                });
                content += '\n';
              });

              const failedTests = tests.filter(t => t.status === 'failed');
              if (failedTests.length > 0) {
                content += '## Failed Tests Details\n\n';
                failedTests.forEach(test => {
                  const framework = test.suite && test.suite[0] ? test.suite[0] : 'unknown';
                  const testName = test.name.replace(framework + ' :: ', '');
                  content += '<details>\n';
                  content += `<summary><strong>${framework}</strong> - ${testName}</summary>\n\n`;
                  if (test.message) content += `**Error:** ${test.message}\n\n`;
                  if (test.trace) content += '```\n' + test.trace + '\n```\n';
                  content += '</details>\n\n';
                });
              }

              resultsContent = content;
            } catch (e) {
              console.log('Could not parse test results:', e.message);
            }
          }

          const issueLabel = 'ai-integration-test-failure';
          const date = new Date();
          const formattedDate = date.toISOString();

          const platform = '${{ inputs.platform }}' || 'all';
          const framework = '${{ inputs.framework }}' || 'all';

          const body = [
            '## AI Integration Test Failure',
            '',
            `**Date**: ${formattedDate}`,
            `**Platform**: ${platform}`,
            `**Framework**: ${framework}`,
            `**Workflow Run**: ${runUrl}`,
            '',
            resultsContent,
            '',
            '---',
            '*This issue was automatically created by the [AI Integration Testing framework](https://github.com/getsentry/testing-ai-sdk-integrations).*'
          ].join('\n');

          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: issueLabel,
            state: 'open'
          });

          if (issues.data.length > 0) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues.data[0].number,
              body: body
            });
            console.log(`Updated existing issue #${issues.data[0].number}`);
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'AI Integration Tests Failed',
              body: body,
              labels: [issueLabel, 'automated']
            });
            console.log('Created new issue');
          }
